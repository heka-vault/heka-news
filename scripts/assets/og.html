<!doctype html>
<!-- The default Open Graph image (public/og.png, 1200×630). Rendered by scripts/render-assets.sh;
     colors match src/styles/tokens.css (the site bar's machine green). Fonts load from
     node_modules, so run bun install first. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Archivo';
        src: url('../../node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2') format('woff2');
        font-weight: 100 900;
        font-stretch: 62% 125%;
      }
      @font-face {
        font-family: 'Source Serif';
        src: url('../../node_modules/@fontsource-variable/source-serif-4/files/source-serif-4-latin-wght-normal.woff2') format('woff2');
        font-weight: 200 900;
      }
      html, body { margin: 0; }
      body {
        width: 1200px;
        height: 630px;
        box-sizing: border-box;
        padding: 64px 80px 64px;
        background: #1f4235;
        color: #eef0eb;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        font-family: 'Archivo', sans-serif;
      }
      .top { display: flex; align-items: center; justify-content: space-between; }
      .brand { display: flex; align-items: center; gap: 16px; font-stretch: 118%; font-weight: 800; font-size: 64px; letter-spacing: -0.02em; }
      .url { font-size: 26px; font-weight: 500; color: #b9cbc1; }
      .rows { display: grid; gap: 22px; }
      .row { display: grid; grid-template-columns: 40px 30px 1fr; align-items: start; gap: 18px; }
      .rank { color: #f2c744; font-size: 26px; font-weight: 650; text-align: right; line-height: 1.25; }
      .mark { width: 15px; height: 32px; margin-top: 2px; }
      .title { font-size: 34px; font-weight: 600; line-height: 1.2; }
      .note { font-family: 'Source Serif', serif; font-size: 32px; line-height: 1.3; }
      .meta { font-size: 21px; color: #b9cbc1; margin-top: 4px; }
      .foot { font-family: 'Source Serif', serif; font-size: 26px; color: #b9cbc1; }
    </style>
  </head>
  <body>
    <div class="top">
      <div class="brand">
        <svg width="58" height="58" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="3" y="3" width="5" height="26" rx="1" fill="#c8b6ff" />
          <rect x="10" y="11" width="5" height="18" rx="1" fill="#eef0eb" />
          <rect x="17" y="11" width="5" height="18" rx="1" fill="#eef0eb" />
          <rect x="24" y="11" width="5" height="18" rx="1" fill="#eef0eb" />
        </svg>
        <span>heka news</span>
      </div>
      <div class="url">news.hekafactory.com</div>
    </div>
    <div class="rows">
      <div class="row">
        <span class="rank">1</span>
        <svg class="mark" viewBox="0 0 10 22" aria-hidden="true"><path d="M5 1 L9 6 V21 H1 V6 Z" fill="none" stroke="#c8b6ff" stroke-width="1.4" stroke-linejoin="round" /></svg>
        <div><div class="title">Links, long posts and status notes</div><div class="meta">from engineers who build software with coding agents</div></div>
      </div>
      <div class="row">
        <span class="rank">2</span>
        <svg class="mark" viewBox="0 0 10 22" aria-hidden="true"><path d="M5 1 L9 6 V21 H1 V6 Z" fill="#c8b6ff" stroke="#c8b6ff" stroke-width="1.4" stroke-linejoin="round" /></svg>
        <div><div class="note">Anyone can read. Members are invited.</div></div>
      </div>
    </div>
    <div class="foot">Run by heka</div>
  </body>
</html>
