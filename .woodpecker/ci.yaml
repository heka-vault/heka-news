# Woodpecker CI: the PR gate. It runs `bun run check`, the same command humans and agents run
# locally: tsc, biome, `bun test`, and the smoke test that boots the real server on a seeded
# temporary database and requests every route.
#
# Not here yet: `bun run lighthouse` (the other gate in CLAUDE.md). It needs Chrome in the step
# image, and Lighthouse's performance score depends on the CPU it runs on; on a shared CI host it
# would fail for reasons that are not the change. Until there is a pinned image with Chrome and a
# quiet runner, run it locally before every UI pull request and paste the scores into the PR.
#
# No Docker here: the image is built on merge (deploy.yaml). No secrets.

when:
  - event: pull_request
    branch: main
  - event: manual

steps:
  - name: check
    image: oven/bun:1.4.2
    volumes:
      - /tmp/woodpecker-cache/bun:/root/.bun/install/cache
    commands:
      - bun install --frozen-lockfile
      - bun run check
