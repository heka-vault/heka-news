# The production stack: /home/eric/sites/heka-news/compose.yaml on the host.
# Never edit the copy on the server. Every push to `main` copies this file there and deploys it
# (.woodpecker/deploy.yaml, .woodpecker/scripts/deploy.sh).
#
# Beside it on the host:
#   .env    TAG, the commit whose image is running, written by the deploy. Nothing secret.
#   vault.env  SESSION_SECRET, GITHUB_CLIENT_ID and GITHUB_CLIENT_SECRET (ADR 0007), and
#           ELEVENLABS_API_KEY, ELEVENLABS_WEBHOOK_SECRET and DISCORD_TALK_WEBHOOK (ADR 0008), from
#           Heka Vault heka-news/prod, written by the deploy, mode 600. Never edit or copy it.
#   data/   the database (heka-news.db and its -wal and -shm files). Owned by uid 1000, the image's
#           `bun` user; the deploy creates it. Back it up; never delete it.
#
# By hand, on the server (the deploy does all of this):
#   docker compose pull && docker compose up -d --wait
name: heka-news

services:
  heka-news:
    image: ${HEKA_NEWS_REGISTRY:-192.168.5.251:5000}/heka-news:${TAG:?}
    restart: unless-stopped
    # Nothing in the container writes outside /data (the volume) and /tmp.
    read_only: true
    tmpfs:
      - /tmp
    # The site's secrets. Values under `environment` win over this file, so none of its keys may
    # appear there.
    env_file:
      - path: vault.env
        required: false
    environment:
      GIT_SHA: ${TAG:?}
      PUBLIC_URL: https://news.hekafactory.com
      DATABASE_PATH: /data/heka-news.db
      # GitHub logins of the moderators, comma-separated (ADR 0003). They sign in without an
      # invitation and start the invite tree.
      MODERATORS: detroitpro
      # "Talk to us" on hekafactory.com (ADR 0008). The key, webhook secret and Discord webhook
      # come from vault.env; tokens stay off until the key is there.
      ELEVENLABS_AGENT_ID: agent_6501m58w5sgpf7p970w3vgxrk852
      TALK_ALLOWED_ORIGINS: https://hekafactory.com
      TALK_DAILY_LIMIT: '10'
    volumes:
      - ./data:/data
    # The Cloudflare tunnel forwards news.hekafactory.com here.
    ports:
      - '127.0.0.1:${HEKA_NEWS_PORT:-3311}:8080'
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
